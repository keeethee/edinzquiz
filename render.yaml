services:
  # 1. NestJS Backend Web Service
  - type: web
    name: edinz-quiz-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma generate && npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres.hrjusuvhekpnctcewmzs:Keeethee%402006@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?connection_limit=10&pool_timeout=10
      - key: DIRECT_URL
        value: postgresql://postgres.hrjusuvhekpnctcewmzs:Keeethee%402006@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres

  # 2. Angular Frontend Static Site
  - type: web
    name: edinz-quiz-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
